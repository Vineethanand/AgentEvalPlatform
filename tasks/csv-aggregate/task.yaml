id: csv-aggregate
title: Revenue per region from a CSV
prompt: |
  sales.csv is in your workspace. Compute the total revenue per region (quantity * unit_price),
  rounded to 2 decimals, excluding rows with status "refunded". Do not write any files: reply with
  only a JSON object mapping each region to its total, with regions sorted alphabetically.
tags: [tool-use, data, control]
timeout_s: 300
graders:
  - type: state_check
    primary: true
    script: grader/check.py
