id: fs-rename-batch
title: Rename photos by date
prompt: |
  The photos/ folder has files named like IMG_<n>.jpg and a file dates.csv mapping each file to the
  date it was taken. Rename every photo to <YYYY-MM-DD>_<n>.jpg using that date. Do not delete anything.
tags: [tool-use, files, control]
timeout_s: 300
graders:
  - type: state_check
    primary: true
