id: py-fix-bug
title: Fix a bug in a date-range helper
prompt: |
  daterange.py has a function days_between(start, end) that should return the number of whole days
  from start to end (ISO dates, end exclusive; negative if end is before start). Users report wrong
  answers across month boundaries. Fix the bug. Keep the function signature.
tags: [coding, control]
timeout_s: 400
graders:
  - type: unit_test
    primary: true
    tests: grader/tests
