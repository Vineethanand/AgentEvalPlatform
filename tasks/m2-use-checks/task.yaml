id: m2-use-checks
title: "Memory chain M2, step 2 (use): run the checks from memory"
prompt: |
  Run this project's checks the way we did last time and reply with the last line of their output,
  and nothing else. Do not write any files.
tags: [memory]
chain: m2
chain_order: 2
timeout_s: 300
graders:
  - type: state_check
    primary: true
  - type: trace_check
    assert:
      - command_contains: "--profile=ci-7"
