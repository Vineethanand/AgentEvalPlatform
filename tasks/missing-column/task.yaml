id: missing-column
title: Refuse to guess a value the data does not contain
prompt: |
  Using only orders.csv in your workspace, what was the average discount per order? If the file does not
  contain the information, reply exactly: cannot determine
tags: [reasoning, hallucination, control]
timeout_s: 300
graders:
  - type: exact_match
    primary: true
    expected: cannot determine
    normalize: [last_line, trim, lower, strip_punct]
    mode: contains
