id: dedupe-emails
title: Count unique email addresses
prompt: |
  contacts.csv in your workspace lists contacts with an email column. Two addresses are the same person if
  they match after lower-casing and after removing any "+tag" from the part before the @ (so
  Ann+news@x.com and ann@x.com are the same). How many unique people are in the file? Reply with just the
  number. Do not write any files.
tags: [tool-use, data, control]
timeout_s: 300
graders:
  - type: exact_match
    primary: true
    expected: "7"
    normalize: [last_line, trim, strip_punct]
    mode: equals
