# Model registry. Adding a model = adding one entry here (plus its key in .env).
# model_name is the alias configs refer to. model_info.price_* is in USD per 1M tokens
# and is snapshotted into each config version so later price changes don't rewrite history.
# Model IDs and prices are examples: check them against the provider's pages before a real run.
model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      extra_headers: {"anthropic-workspace-id": "wrkspc_01QyB8NMT7Gdfd3WRo3PwcjP"}
    model_info:
      price_input_per_mtok: 3.00
      price_output_per_mtok: 15.00
      provider: anthropic

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      extra_headers: {"anthropic-workspace-id": "wrkspc_01QyB8NMT7Gdfd3WRo3PwcjP"}
    model_info:
      price_input_per_mtok: 1.00
      price_output_per_mtok: 5.00
      provider: anthropic

  - model_name: gpt-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      price_input_per_mtok: 0.40
      price_output_per_mtok: 1.60
      provider: openai

  - model_name: qwen-open
    litellm_params:
      model: openrouter/qwen/qwen3-235b-a22b
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      price_input_per_mtok: 0.20
      price_output_per_mtok: 0.60
      provider: openrouter
      open_weight: true

  # Free models that Hermes lists (Poolside Laguna XS 2.1, Thinking Machines Inkling Small). They are hosted on OpenRouter, so they
  # need OPENROUTER_API_KEY; the free tier is rate limited, so expect 429s on large runs.
  - model_name: laguna-xs-free
    litellm_params:
      model: openrouter/poolside/laguna-xs-2.1:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      price_input_per_mtok: 0
      price_output_per_mtok: 0
      provider: openrouter
      open_weight: true

  - model_name: inkling-small-free
    litellm_params:
      model: openrouter/thinkingmachines/inkling-small:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      price_input_per_mtok: 0
      price_output_per_mtok: 0
      provider: openrouter
      open_weight: true

  # Local model served by Ollama on the host machine (run `ollama serve`; pull with `ollama pull qwen2.5:7b`).
  - model_name: ollama-qwen
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: http://host.docker.internal:11434
    model_info:
      price_input_per_mtok: 0
      price_output_per_mtok: 0
      provider: ollama
      open_weight: true

  # Smaller/faster local model for plumbing tests on CPU (`ollama pull qwen2.5:1.5b`). Weak at tool calling.
  - model_name: ollama-qwen-1.5b
    litellm_params:
      model: ollama_chat/qwen2.5:1.5b
      api_base: http://host.docker.internal:11434
      num_ctx: 16384
    model_info:
      price_input_per_mtok: 0
      price_output_per_mtok: 0
      provider: ollama
      open_weight: true

  # Mid-size local model (`ollama pull qwen2.5:3b`). Slow on CPU; still weak at tool calling.
  - model_name: ollama-qwen-3b
    litellm_params:
      model: ollama_chat/qwen2.5:3b
      api_base: http://host.docker.internal:11434
      num_ctx: 16384
    model_info:
      price_input_per_mtok: 0
      price_output_per_mtok: 0
      provider: ollama
      open_weight: true

  # Judge model: pick a different provider from the agent models where possible.
  - model_name: gpt-judge
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      price_input_per_mtok: 0.40
      price_output_per_mtok: 1.60
      provider: openai

litellm_settings:
  num_retries: 3          # retries 429 / 5xx with backoff
  request_timeout: 120
  drop_params: true       # silently drop params a provider doesn't support (e.g. seed)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
